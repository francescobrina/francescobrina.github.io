name: Build PDF Universale 2 EXE
on:
  push:
    paths:
      - 'pdf-universale/desktop/**'
      - '.github/workflows/build-pdf-universale.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Extract source
        shell: pwsh
        run: |
          $inputFile = 'pdf-universale/desktop/PDF_Universale_2.0_Desktop_Sorgenti.zip.b64'
          $encoded = Get-Content -Raw $inputFile
          $archive = Join-Path $env:RUNNER_TEMP 'source.zip'
          [System.IO.File]::WriteAllBytes($archive,[Convert]::FromBase64String($encoded.Trim()))
          $dir = Join-Path $env:RUNNER_TEMP 'pdfapp'
          Expand-Archive -Path $archive -DestinationPath $dir -Force
          Write-Host "Extracted: $dir"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:RUNNER_TEMP/pdfapp/PDF_Universale_2.0/requirements.txt"
          python -m pip install pyinstaller
      - name: Regression test with corrupt and unsupported files
        shell: pwsh
        run: |
          python "$env:RUNNER_TEMP/pdfapp/PDF_Universale_2.0/test_fault_tolerance.py"
      - name: Build executable
        shell: pwsh
        run: |
          Set-Location "$env:RUNNER_TEMP/pdfapp/PDF_Universale_2.0"
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name PDF_Universale_2 --collect-all fitz --collect-all pymupdf pdf_universale_v2.py
          if (!(Test-Path dist/PDF_Universale_2.exe)) { throw 'EXE not produced' }
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: PDF_Universale_2_Windows_EXE
          path: ${{ runner.temp }}/pdfapp/PDF_Universale_2.0/dist/PDF_Universale_2.exe
          if-no-files-found: error
          retention-days: 30
